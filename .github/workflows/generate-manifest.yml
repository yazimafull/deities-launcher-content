name: Generate Manifests

on:
  push:
    branches: [main]
    paths:
      - "Jeux/**"
      - "distribution-files.json"
      - "tools/generate-manifests.cjs"
      - ".github/workflows/generate-manifest.yml"

permissions:
  contents: write

concurrency:
  group: content-manifests-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate from committed Git blobs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/generate-manifests.cjs --revision "$SOURCE_SHA" --write
      - name: Commit only manifests if source is still current
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SOURCE_SHA" ]]; then
            echo "main changed; refuse stale manifest publication."
            exit 1
          fi
          git add -- ':(glob)Jeux/*/manifest.json'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(content): update game manifests"
          git push origin HEAD:main
